<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1322">
<title>Spot Kick Legends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a floodlit night-time football game
   IDEA a tournament broadcast: scorebug, bracket wallchart, kit-coloured team chips
   PICTURE the canvas penalty box: goal, net, keeper, taker, ball and the aim spread
   COLOUR night navy ground, pitch green, floodlight white, coin gold, goal green, miss red
   TYPE Anton display + Barlow text
   LAYOUT one phone column (max 540px): scorebug, pitch, controls; centred on a laptop */
:root{color-scheme:dark;--bg:#0a1322;--panel:#13213b;--panel2:#1b2c4d;--line:#2b3f66;--ink:#f3f6ff;--mute:#a7b6d6;--gold:#ffc83d;--red:#ff5a5f;--go:#3ddc84;--grass:#1c8f45}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;position:sticky;top:0;background:var(--bg);z-index:5}
.top .logo{font:22px/1 Anton,Impact,sans-serif;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coins{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b3,var(--gold) 55%,#c48a00);box-shadow:inset 0 0 0 2px #d79c00;display:inline-block;flex:none}
.icon{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:20px;height:20px}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.005em;line-height:1.05;margin:0}
h2{font-size:34px;margin-block:6px 4px}
h3{font-size:22px}
p{margin:6px 0}
.mute{color:var(--mute)}
.btn{appearance:none;border:0;border-radius:12px;background:var(--panel2);color:var(--ink);font:700 16px Barlow,sans-serif;padding:12px 16px;min-height:46px;cursor:pointer;border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--gold);color:#1a1200;border-color:#e0a800}
.btn.go{background:var(--go);color:#03210f;border-color:#2bb56a}
.btn.big{font-size:19px;min-height:54px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.stack{display:grid;gap:10px}
.flag{display:inline-block;width:22px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.35);vertical-align:-3px;flex:none}
.hero{border-radius:18px;overflow:hidden;background:#0d1a33;margin-block:4px 14px}
.hero svg{display:block;width:100%;height:auto}
.title{font:clamp(44px,13vw,64px)/.95 Anton,Impact,sans-serif;letter-spacing:-.01em;margin:4px 0 6px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:14px}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.fig b{display:block;font:28px/1 Anton,Impact,sans-serif}
.fig span{font-size:13px;color:var(--mute)}
.search{width:100%;font:16px Barlow,sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-block:8px 12px}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.team{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer;min-height:56px}
.team .flag{width:30px;height:22px}
.team small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.team .ovr{font:20px Anton,Impact,sans-serif;color:var(--gold)}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brk{overflow-x:auto;margin-inline:-4px;padding:4px 4px 8px}
.brk-in{display:grid;grid-template-columns:repeat(5,minmax(116px,1fr));gap:10px;min-width:620px;height:560px}
.col{display:flex;flex-direction:column;min-height:0}
.col h4{margin:0 0 6px;font:600 13px Barlow,sans-serif;color:var(--mute);white-space:nowrap}
.ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;position:relative}
.m.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.m.now{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(255,200,61,.45)}}
.tr{display:flex;align-items:center;gap:6px;font-size:14px;padding:2px 0;white-space:nowrap}
.tr b{flex:1;font-weight:600}
.tr.win b{color:var(--ink);font-weight:700}
.tr.lose{opacity:.5}
.tr .sc{font-variant-numeric:tabular-nums;font-weight:700}
.champ{display:grid;place-items:center;text-align:center;gap:6px}
.cup{width:64px;height:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.next .flag{width:40px;height:30px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.list{display:grid;gap:6px}
.pl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:50px;cursor:pointer;color:var(--ink);font:15px Barlow,sans-serif;text-align:left;width:100%}
.pl.sel{border-color:var(--go);background:#123a2c}
.pl .ord{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:700;font-size:14px}
.pl.sel .ord{background:var(--go);color:#03210f}
.pl .r{font:20px Anton,Impact,sans-serif}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;background:#3b2b00;color:var(--gold);margin-left:6px;vertical-align:1px}
.tag.gk{background:#18324f;color:#9fd2ff}
.sec{margin-block:18px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h3{font-size:22px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:14px;height:6px;border-radius:3px;background:var(--panel2)}
.pips i.on{background:var(--gold)}
.costbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* match */
.bug{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;background:#07101f;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.bugrow{display:grid;grid-template-columns:auto 44px minmax(0,1fr) 28px;align-items:center;gap:8px}
.bugrow b{font-weight:700}
.bugrow .g{font:24px/1 Anton,Impact,sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #3a4f78}
.dots i.y{background:var(--go);border-color:var(--go)}
.dots i.n{background:var(--red);border-color:var(--red)}
.dots i.now{border-color:var(--gold)}
.bughead{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.bughead b{color:var(--gold);font-weight:700}
.stage{position:relative;margin:0 auto;width:100%;max-width:max(290px,calc((100svh - 350px)*400/440))}
#cv{display:block;width:100%;aspect-ratio:400/440;border-radius:14px;touch-action:none;background:#0d1a33}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(6,12,24,.78);border-radius:14px;text-align:center;overflow:auto}
.ov>div{display:grid;gap:8px;max-width:340px}
.ov .vs{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.ov .tip{font-size:14px;color:var(--mute)}
.ctl{margin-top:8px;display:grid;gap:6px}
.taker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.taker b{font-size:17px}
.taker .r{font:20px Anton,Impact,sans-serif;color:var(--gold)}
.hint{font-size:14px;color:var(--mute);min-height:20px}
.sl{display:grid;grid-template-columns:62px minmax(0,1fr) 78px;align-items:center;gap:10px;font-weight:600}
.sl output{text-align:right;font-size:14px;color:var(--mute);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2d6cdf,#ffc83d,#ff5a5f)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2d6cdf,#ffc83d,#ff5a5f)}
#cur::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ff5a5f,#ffc83d 35%,#3ddc84 50%,#ffc83d 65%,#ff5a5f)}
#cur::-moz-range-track{background:linear-gradient(90deg,#ff5a5f,#ffc83d 35%,#3ddc84 50%,#ffc83d 65%,#ff5a5f)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #0a1322;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0a1322}
.accrow{display:grid;grid-template-columns:62px minmax(0,1fr) 128px;gap:10px;align-items:center}
.accbar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.accbar i{display:block;height:100%;border-radius:6px;transition:width .15s}
#shoot{min-height:52px;font:22px Anton,Impact,sans-serif;letter-spacing:.02em}
.keepmsg{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:600}
.res{text-align:center;padding-block:10px}
.res .big{font:clamp(48px,14vw,72px)/1 Anton,Impact,sans-serif}
.ledger{display:grid;gap:6px;margin-block:12px}
.ledger div{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:10px 12px}
.ledger div b{font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}
.ledger .tot{background:var(--panel2);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.m.now{animation:none}.confetti{display:none}}
@media(max-width:380px){.teams{grid-template-columns:minmax(0,1fr)}.accrow{grid-template-columns:52px minmax(0,1fr) 110px}.sl{grid-template-columns:52px minmax(0,1fr) 70px}}
</style>

</head>
<body>
<div id="app">
  <div class="top">
    <button class="icon" id="backBtn" data-act="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="logo">Spot Kick Legends</div>
    <span class="coins"><i class="coin"></i><span id="coinv">0</span></span>
    <button class="icon" id="muteBtn" data-act="mute" aria-label="Sound"></button>
  </div>

  <section class="scr" id="scr-menu"></section>
  <section class="scr" id="scr-teams" hidden>
    <h2>Pick your nation</h2>
    <p class="mute">51 nations. Each has today's squad, plus legends you can sign with coins.</p>
    <input class="search" id="teamSearch" placeholder="Search nations" autocomplete="off">
    <div class="teams" id="teamList"></div>
  </section>
  <section class="scr" id="scr-bracket" hidden></section>
  <section class="scr" id="scr-squad" hidden></section>
  <section class="scr" id="scr-upgrades" hidden></section>
  <section class="scr" id="scr-trophies" hidden></section>
  <section class="scr" id="scr-result" hidden></section>
  <section class="scr" id="scr-match" hidden>
    <div class="bug" id="bug"></div>
    <div class="stage"><canvas id="cv"></canvas><div class="ov" id="ov" hidden></div></div>
    <div class="ctl" id="ctlShoot" hidden>
      <div class="taker" id="tkShoot"></div>
      <div class="hint" id="hintShoot"></div>
      <label class="sl"><span>Power</span><input type="range" id="pow" min="0" max="100" value="55"><output id="powv"></output></label>
      <label class="sl"><span>Curve</span><input type="range" id="cur" min="-100" max="100" value="0"><output id="curv"></output></label>
      <div class="accrow"><span style="font-weight:600">Accuracy</span><div class="accbar"><i id="accfill"></i></div><button class="btn pri" id="shoot" data-act="shoot">Shoot</button></div>
    </div>
    <div class="ctl" id="ctlKeep" hidden>
      <div class="taker" id="tkKeep"></div>
      <div class="hint" id="hintKeep"></div>
      <div class="keepmsg" id="keepMsg">Tap a zone in the goal to dive</div>
    </div>
  </section>
</div>

const pp=s=>{const m=s.trim().match(/^(.*)\s(\d+)$/);return {n:m[1],r:+m[2]}};

  const f=line.split('|');

  const legends=f[7].split(',').map(s=>({...pp(s),leg:1}));
  const gk={...pp(f[4]),gk:1}, lgk={...pp(f[6]),gk:1,leg:1};
  const top=[...players].sort((a,b)=>b.r-a.r).slice(0,5);
  const str=Math.round(top.reduce((s,p)=>s+p.r,0)/5*0.7+gk.r*0.3);
  const pat=f[8]?{t:f[8][0],c:f[8].slice(2)}:null;
  return {name:f[0],code:f[1],c1:f[2],c2:f[3],gk,lgk,players,legends,str,pat};
});

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const hash=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function chipBg(t){const a=t.c1,b=t.c2,p=t.pat;
  if(p&&p.t==='v')return `repeating-linear-gradient(90deg,${a} 0 4px,${p.c} 4px 8px)`;

const squad=c=>{const t=T[c],own=S.owned[c]||[];return [...t.players,...t.legends.filter(l=>own.includes(l.n))]};
const keepers=c=>{const t=T[c],own=S.owned[c]||[];return own.includes(t.lgk.n)?[t.gk,t.lgk]:[t.gk]};
function takers(c){const sq=squad(c);let sel=(S.takers[c]||[]).map(n=>sq.find(p=>p.n===n)).filter(Boolean);
  if(sel.length<5)sel=sel.concat(sq.filter(p=>!sel.includes(p)).sort((a,b)=>b.r-a.r).slice(0,5-sel.length));return sel.slice(0,5)}
const myKeeper=c=>{const ks=keepers(c);return ks.find(k=>k.n===S.gksel[c])||ks.reduce((a,b)=>b.r>a.r?b:a)};
const aiTakers=c=>{const t=T[c],nL=Math.min(S.prestige,5);return [...t.players,...[...t.legends].sort((a,b)=>b.r-a.r).slice(0,nL)].sort((a,b)=>b.r-a.r).slice(0,5)};
const aiKeeper=c=>{const t=T[c];return S.prestige>=2&&t.lgk.r>t.gk.r?t.lgk:t.gk};

/* ---------- tournament ---------- */
function newTour(code){
  const pool=TEAMS.filter(t=>t.code!==code),picks=[];const w=t=>Math.pow(Math.max(1,t.str-68),2);
  while(picks.length<15){let tot=pool.reduce((s,t)=>s+w(t),0),r=Math.random()*tot,i=0;for(;i<pool.length-1;i++){r-=w(pool[i]);if(r<=0)break}picks.push(pool.splice(i,1)[0].code)}
  const teams=shuffle([code,...picks]),r0=[];
  for(let i=0;i<8;i++)r0.push({a:teams[2*i],b:teams[2*i+1],w:null,sa:0,sb:0});
  S.tour={team:code,rounds:[r0],r:0,out:false,done:false,champ:false};save();
}
function decided(ga,na,gb,nb){
  if(na<=5&&nb<=5&&!(na===5&&nb===5)){if(ga+(5-na)<gb)return 'b';if(gb+(5-nb)<ga)return 'a';return null}
  if(na===nb&&ga!==gb)return ga>gb?'a':'b';return null}
function simMatch(m){
  const ta=aiTakers(m.a),tb=aiTakers(m.b),ka=aiKeeper(m.a).r+S.prestige,kb=aiKeeper(m.b).r+S.prestige;
  const p=(s,k)=>Math.random()<clamp(.74+(s.r-k)*.012,.45,.93);
  let ga=0,gb=0,na=0,nb=0,d=null;
  while(!d&&na<40){ga+=p(ta[na%5],kb);na++;d=decided(ga,na,gb,nb);if(d)break;gb+=p(tb[nb%5],ka);nb++;d=decided(ga,na,gb,nb)}
  m.sa=ga;m.sb=gb;m.w=d==='a'?m.a:m.b}
function finishRound(){const t=S.tour,R=t.rounds[t.r];R.forEach(m=>{if(!m.w)simMatch(m)});
  if(t.r<3){const nx=[];for(let i=0;i<R.length;i+=2)nx.push({a:R[i].w,b:R[i+1].w,w:null,sa:0,sb:0});t.rounds.push(nx);t.r++}else t.done=true}

let AC=null;
function ac(){if(S.muted)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function thump(){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.22)}
function noise(dur,freq,vol,rise){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.6;const g=a.createGain(),t=a.currentTime;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+rise);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t)}
function whistle(len=.35){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),g=a.createGain();o.frequency.value=2900;l.frequency.value=32;lg.gain.value=120;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.03);g.gain.setValueAtTime(.12,t+len-.05);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(a.destination);o.start(t);l.start(t);o.stop(t+len);l.stop(t+len)}
const cheer=()=>noise(2,1100,.4,.12),groan=()=>noise(1.3,380,.3,.1),clang=()=>{const a=ac();if(!a)return;const t=a.currentTime;[880,1320,2210].forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.6)})};

function spreadFor(sh,p,c,press){const U=S.up;let s=(.05+(99-sh.r)*.0075)*(1-U.prec*.06);s+=p*p*.34*(1-U.pow*.09);s+=Math.abs(c)*.26*(1-U.bend*.09);if(press)s+=.07*(1-U.nerve*.15);return s}

function whoseTurn(){const a=M.k.me.length,b=M.k.op.length;if(a===b)return M.firstMe?'me':'op';return a<b?'me':'op'}

  return who==='me'?!!(decided(gm+1,a.length+1,go,b.length)||decided(gm,a.length+1,go,b.length)):!!(decided(gm,a.length,go+1,b.length+1)||decided(gm,a.length,go,b.length+1))}

function powCur(){let c=+$('#cur').value;if(Math.abs(c)<8)c=0;return {p:+$('#pow').value/100,c:c/100}}

function bez(p0,p1,p2,t){const u=1-t;return {x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x,y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y}}

function shoot(){
  if(!M||M.phase!=='aim')return;ac();
  const sh=curTaker(),{p,c}=powCur(),s=spreadFor(sh,p,c,M.press);
  const ang=Math.random()*Math.PI*2,rr=s*Math.pow(Math.random(),.7);
  let bx=aim.x+Math.cos(ang)*rr,by=Math.max(.04,aim.y+p*p*.10+Math.sin(ang)*rr*1.2);
  let res,kx=0,ky=.45;
  if(Math.abs(bx)>1||by>1){res=(Math.abs(bx)<1.05&&by<1.06)||(by>1&&by<1.06&&Math.abs(bx)<1.05)?'post':'miss';
    kx=clamp((Math.random()*2-1)*.8+M.kb,-.9,.9);ky=.2+Math.random()*.5}
  else{
    const K=M.K,decep=Math.abs(c)*(.22+S.up.bend*.03),read=clamp(.22+(K-75)/160-decep,.05,.6),r=Math.random();
    if(r<read){kx=bx+(Math.random()-.5)*.3;ky=by+(Math.random()-.5)*.25}
    else if(r<read+.12){kx=0;ky=.45}
    else{kx=clamp((Math.random()*2-1)*.85+M.kb,-.92,.92);ky=.15+Math.random()*.6}

function dive(zc,zr){

  const r1=Math.random();const col=r1<.14?0:r1<.14+fw?favSide:-favSide;const row=Math.random()<hp?1:0;

  const missP=clamp(.03+(95-sh.r)*.006+(row?.05:0)+(M.press?.05:0),.02,.3);
  if(Math.random()<missP){if(row&&Math.random()<.5)by=1.02+Math.random()*.2;else bx=(col||(Math.random()<.5?-1:1))*(1.02+Math.random()*.18);

  floaters=floaters.filter(f=>now-f.t0<1200);for(const f of floaters){const k=(now-f.t0)/1200;ctx.globalAlpha=1-k;ctx.font='700 20px Barlow,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.txt,f.x,f.y-40*k);ctx.fillStyle='#ffc83d';ctx.fillText(f.txt,f.x,f.y-40*k);ctx.globalAlpha=1}
}
function startLoop(){if(looping)return;looping=true;const f=now=>{if(cur!=='scr-match'||!M){looping=false;return}try{draw(now)}catch(e){console.error(e)}requestAnimationFrame(f)};requestAnimationFrame(f)}

function evPt(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
let dragging=false;
function setAim(pt){aim={x:clamp(x2gx(pt.x),-1.25,1.25),y:clamp(y2gy(pt.y),0,1.35)}}
function zoneAt(pt){const gx=x2gx(pt.x),gy=y2gy(pt.y);if(gx<-1.3||gx>1.3||gy<-.4||gy>1.4)return null;return {c:gx<-1/3?-1:gx>1/3?1:0,r:gy>.5?1:0}}
cv.addEventListener('pointerdown',ev=>{if(!M)return;const pt=evPt(ev);
  if(M.phase==='aim'){dragging=true;cv.setPointerCapture(ev.pointerId);setAim(pt)}
  else if(M.phase==='pick'){const z=zoneAt(pt);if(z){hoverZ=null;dive(z.c,z.r)}}});
cv.addEventListener('pointermove',ev=>{if(!M)return;const pt=evPt(ev);if(dragging&&M.phase==='aim')setAim(pt);else if(M.phase==='pick'&&ev.pointerType==='mouse')hoverZ=zoneAt(pt)});
cv.addEventListener('pointerup',()=>dragging=false);cv.addEventListener('pointercancel',()=>dragging=false);
$('#pow').addEventListener('input',updAcc);$('#cur').addEventListener('input',updAcc);
$('#cur').addEventListener('change',e=>{if(Math.abs(+e.target.value)<8)e.target.value=0;updAcc()});

/* ---------- actions ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act;
  if(act!=='new')abandonArmed=false;
  switch(act){
    case 'mute':S.muted=!S.muted;save();setMuteIcon();if(!S.muted)ac();break;
    case 'back':if(cur==='scr-squad'||cur==='scr-upgrades'){if(prev==='scr-bracket'){renderBracket();show('scr-bracket')}else if(prev==='scr-result'){renderResult();show('scr-result')}else{renderMenu();show('scr-menu')}}else{renderMenu();show('scr-menu')}break;
    case 'new':{const t=S.tour;if(t&&!t.done&&!t.out&&!abandonArmed&&cur==='scr-menu'){abandonArmed=true;el.textContent='Tap again to abandon this cup';break}abandonArmed=false;renderTeams($('#teamSearch').value);show('scr-teams');break}
    case 'pick':ac();newTour(el.dataset.c);renderBracket();show('scr-bracket');whistle(.25);break;
    case 'go-bracket':renderBracket();show('scr-bracket');break;
    case 'go-squad':renderSquad();show('scr-squad');break;
    case 'go-upgrades':renderUpgrades();show('scr-upgrades');break;
    case 'go-trophies':renderTrophies();show('scr-trophies');break;
    case 'play':ac();startMatch();break;
    case 'kickoff':overlay(null);whistle();M.phase='wait';setTimeout(nextTurn,400);break;
    case 'shoot':shoot();break;
    case 'result':overlay(null);renderResult();show('scr-result');break;
    case 'taker':{const c=S.tour.team,n=el.dataset.n;let sel=S.takers[c]?[...S.takers[c]]:takers(c).map(p=>p.n);
      const i=sel.indexOf(n);if(i>=0)sel.splice(i,1);else if(sel.length<5)sel.push(n);else{toast('Five takers already chosen. Tap one to remove it.');break}
      S.takers[c]=sel;save();renderSquad();if(sel.length<5)toast(sel.length===0?'Tap players in kick order. Empty slots fill with your best.':`${5-sel.length} more to pick. Empty slots fill with your best.`);break}
    case 'gk':S.gksel[S.tour.team]=el.dataset.n;save();renderSquad();break;
    case 'sign':{const c=S.tour.team,t=T[c],n=el.dataset.n,l=[...t.legends,t.lgk].find(x=>x.n===n),cost=legCost(l.r);if(S.coins<cost)break;
      S.coins-=cost;(S.owned[c]=S.owned[c]||[]).push(n);if(l.gk)S.gksel[c]=n;save();renderSquad();toast(`${n} signed!`);break}
    case 'buy':{const u=UPS.find(x=>x.id===el.dataset.u),l=S.up[u.id],cost=upCost(u,l);if(l>=u.max||S.coins<cost)break;S.coins-=cost;S.up[u.id]++;save();renderUpgrades();toast(`${u.name} is now level ${S.up[u.id]}`);break}
  }
});
$('#teamSearch').addEventListener('input',e=>renderTeams(e.target.value));

function boot(d){
  load(d&&typeof d.coins==='number'?d:readLS());
  window.claude?.hot?.snapshot?.(()=>S);
  save();setMuteIcon();renderMenu();show('scr-menu');
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
